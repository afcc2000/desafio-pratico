<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de acesso a sistema</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background-color: #2C2A29;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background-color: #F4F4F2;
            border-radius: 8px;
            padding: 40px;
            max-width: 600px;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1 {
            font-size: 24px;
            color: #2C2A29;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: #6B6A67;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            color: #2C2A29;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .required {
            color: #D32F2F;
            margin-left: 4px;
        }

        input[type="text"],
        select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #D0CCCB;
            border-radius: 4px;
            font-size: 14px;
            font-family: inherit;
            background-color: #FFFFFF;
            color: #2C2A29;
        }

        input[type="text"]:read-only {
            background-color: #F9F9F8;
            color: #6B6A67;
            cursor: not-allowed;
        }

        input[type="text"]:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #3CDBC0;
            box-shadow: 0 0 0 3px rgba(60, 219, 192, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .radio-group {
            display: flex;
            gap: 30px;
            margin-top: 8px;
        }

        .radio-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        input[type="radio"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .radio-item label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 400;
        }

        .counter {
            font-size: 12px;
            margin-top: 6px;
            font-weight: 500;
        }

        .error-message {
            color: #D32F2F;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .btn-primary {
            background-color: #3CDBC0;
            color: #FFFFFF;
        }

        .btn-primary:hover {
            background-color: #2eb5a0;
        }

        .btn-secondary {
            background-color: #D0CCCB;
            color: #2C2A29;
        }

        .btn-secondary:hover {
            background-color: #b8b3af;
        }

        .form-section {
            display: block;
        }

        .form-section.hidden {
            display: none;
        }

        .summary-section {
            display: none;
        }

        .summary-section.show {
            display: block;
        }

        .summary-item {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #D0CCCB;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            font-size: 12px;
            color: #6B6A67;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .summary-value {
            font-size: 16px;
            color: #2C2A29;
            font-weight: 500;
        }

        .success-message {
            background-color: #E8F5E9;
            border: 1px solid #4CAF50;
            color: #2E7D32;
            padding: 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message.show {
            display: block;
        }

        .justify-value {
            word-break: break-word;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 data-testid="titulo">Solicitação de acesso a sistema</h1>
        <p class="subtitle" data-testid="subtitulo">Seus dados já foram preenchidos pelo login</p>

        <!-- Seção de Dados do Usuário -->
        <div class="form-group">
            <label for="nome">Nome</label>
            <input type="text" id="nome" data-testid="nome" value="Marina Souza" readonly>
        </div>

        <div class="form-group">
            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" data-testid="matricula" value="48213" readonly>
        </div>

        <!-- Formulário -->
        <form class="form-section" id="formSection" data-testid="formulario">
            <div class="form-group">
                <label for="sistema">
                    Sistema
                    <span class="required" data-testid="asterisco">*</span>
                </label>
                <select id="sistema" data-testid="campo-sistema">
                    <option value="">Selecione</option>
                    <option value="sei">SEI</option>
                    <option value="sigepe">SIGEPE</option>
                    <option value="glpi">GLPI</option>
                </select>
                <div class="error-message" data-testid="erro-sistema">Campo obrigatório</div>
            </div>

            <div class="form-group">
                <label>
                    Tipo de acesso
                    <span class="required" data-testid="asterisco">*</span>
                </label>
                <div class="radio-group">
                    <div class="radio-item">
                        <input type="radio" id="leitura" name="tipo" value="leitura" data-testid="opcao-leitura">
                        <label for="leitura">Leitura</label>
                    </div>
                    <div class="radio-item">
                        <input type="radio" id="escrita" name="tipo" value="escrita" data-testid="opcao-escrita">
                        <label for="escrita">Escrita</label>
                    </div>
                </div>
                <div class="error-message" data-testid="erro-tipo">Campo obrigatório</div>
            </div>

            <div class="form-group">
                <label for="justificativa">
                    Justificativa
                    <span class="required" data-testid="asterisco">*</span>
                </label>
                <textarea id="justificativa" data-testid="campo-justificativa" style="display: none;"></textarea>
                <div class="counter" data-testid="contador" style="display: none; color: #6B6A67;">0/20</div>
                <div class="error-message" data-testid="erro-justificativa">Campo obrigatório</div>
            </div>

            <div class="button-group">
                <button type="button" id="btnContinuar" data-testid="btn-continuar" class="btn-primary">Continuar</button>
            </div>
        </form>

        <!-- Resumo -->
        <div class="summary-section" id="summarySection" data-testid="resumo">
            <div class="success-message" id="successMessage" data-testid="mensagem-sucesso">
                Chamado #2026-00412 aberto com sucesso
            </div>

            <div class="summary-item">
                <div class="summary-label">Sistema</div>
                <div class="summary-value" id="summarySystem"></div>
            </div>

            <div class="summary-item">
                <div class="summary-label">Tipo de acesso</div>
                <div class="summary-value" id="summaryType"></div>
            </div>

            <div class="summary-item">
                <div class="summary-label">Justificativa</div>
                <div class="summary-value justify-value" id="summaryJustify"></div>
            </div>

            <div class="button-group">
                <button type="button" id="btnVoltar" data-testid="btn-voltar" class="btn-secondary">Voltar e editar</button>
                <button type="button" id="btnAbrir" data-testid="btn-abrir" class="btn-primary">Abrir chamado</button>
            </div>
        </div>
    </div>

    <script>
        const formSection = document.getElementById('formSection');
        const summarySection = document.getElementById('summarySection');
        const successMessage = document.getElementById('successMessage');

        const sistemaSel = document.getElementById('sistema');
        const leituraRadio = document.getElementById('leitura');
        const escritaRadio = document.getElementById('escrita');
        const justificativaTextarea = document.getElementById('justificativa');
        const contadorEl = document.getElementById('contador');

        const erroSistema = document.querySelector('[data-testid="erro-sistema"]');
        const erroTipo = document.querySelector('[data-testid="erro-tipo"]');
        const erroJustificativa = document.querySelector('[data-testid="erro-justificativa"]');

        const btnContinuar = document.getElementById('btnContinuar');
        const btnVoltar = document.getElementById('btnVoltar');
        const btnAbrir = document.getElementById('btnAbrir');

        const summarySystem = document.getElementById('summarySystem');
        const summaryType = document.getElementById('summaryType');
        const summaryJustify = document.getElementById('summaryJustify');

        // Atualizar visibilidade da justificativa quando tipo muda
        function atualizarVisibilidadeJustificativa() {
            if (escritaRadio.checked) {
                justificativaTextarea.style.display = 'block';
                contadorEl.style.display = 'block';
            } else {
                justificativaTextarea.style.display = 'none';
                contadorEl.style.display = 'none';
                erroJustificativa.classList.remove('show');
                justificativaTextarea.value = '';
                atualizarContador();
            }
        }

        leituraRadio.addEventListener('change', atualizarVisibilidadeJustificativa);
        escritaRadio.addEventListener('change', atualizarVisibilidadeJustificativa);

        // Atualizar contador de justificativa
        function atualizarContador() {
            const length = justificativaTextarea.value.length;
            contadorEl.textContent = length + '/20';

            if (length >= 20) {
                contadorEl.style.color = '#2E7D32';
            } else {
                contadorEl.style.color = '#6B6A67';
            }
        }

        justificativaTextarea.addEventListener('input', atualizarContador);

        // Limpar erro ao modificar campo
        sistemaSel.addEventListener('change', () => {
            if (sistemaSel.value !== '') {
                erroSistema.classList.remove('show');
            }
        });

        leituraRadio.addEventListener('change', () => {
            erroTipo.classList.remove('show');
        });

        escritaRadio.addEventListener('change', () => {
            erroTipo.classList.remove('show');
        });

        justificativaTextarea.addEventListener('input', () => {
            if (justificativaTextarea.value.length >= 20) {
                erroJustificativa.classList.remove('show');
            }
        });

        // Validação ao clicar Continuar
        btnContinuar.addEventListener('click', () => {
            let temErro = false;

            // Validar sistema
            if (sistemaSel.value === '') {
                erroSistema.classList.add('show');
                temErro = true;
            } else {
                erroSistema.classList.remove('show');
            }

            // Validar tipo
            const tipoSelecionado = leituraRadio.checked || escritaRadio.checked;
            if (!tipoSelecionado) {
                erroTipo.classList.add('show');
                temErro = true;
            } else {
                erroTipo.classList.remove('show');
            }

            // Validar justificativa (se Escrita)
            if (escritaRadio.checked && justificativaTextarea.value.length < 20) {
                erroJustificativa.classList.add('show');
                temErro = true;
            } else {
                erroJustificativa.classList.remove('show');
            }

            // Se tudo ok, mostrar resumo
            if (!temErro) {
                formSection.classList.add('hidden');
                summarySection.classList.add('show');
                successMessage.classList.remove('show');

                // Preencher resumo
                const sistemaNome = document.querySelector(`#sistema option[value="${sistemaSel.value}"]`).textContent;
                const tipoNome = leituraRadio.checked ? 'Leitura' : 'Escrita';

                summarySystem.textContent = sistemaNome;
                summaryType.textContent = tipoNome;
                summaryJustify.textContent = justificativaTextarea.value;
            }
        });

        // Voltar e editar
        btnVoltar.addEventListener('click', () => {
            summarySection.classList.remove('show');
            formSection.classList.remove('hidden');
            successMessage.classList.remove('show');
        });

        // Abrir chamado
        btnAbrir.addEventListener('click', () => {
            successMessage.classList.add('show');
            btnAbrir.disabled = true;
            btnVoltar.disabled = true;
        });
    </script>
</body>
</html>
